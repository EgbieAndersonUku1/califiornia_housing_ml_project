[project]
name = "califiornia-housing-ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abbieRU", email = "egbieruku@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "tensorboard>=2.21.0",
    "tensorflow>=2.22.0rc0",
    "torch>=2.14.1",
]

[project.scripts]
califiornia-housing-ml-project = "califiornia_housing_ml_project:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
